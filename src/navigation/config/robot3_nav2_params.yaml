controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    failure_tolerance: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      desired_linear_vel: 3.0

      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.50

      rotate_to_heading_angular_vel: 0.80
      transform_tolerance: 0.30

      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60

      max_allowed_time_to_collision_up_to_carrot: 1.00

      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.00
      inflation_cost_scaling_factor: 3.00

      allow_reversing: false
      use_rotate_to_heading: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: robot3/odom
      robot_base_frame: robot3/base_link

      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.30

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.35
      track_unknown_space: false

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /robot3/scan
          data_type: LaserScan

          clearing: true
          marking: true

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.50

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.50
      use_astar: false
      allow_unknown: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: robot3/map
      robot_base_frame: robot3/base_link

      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.30

      resolution: 0.05
      robot_radius: 0.35
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true

        map_topic: /robot3/map
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /robot3/scan
          data_type: LaserScan

          clearing: true
          marking: true

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.50

      always_send_full_costmap: true


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_frame: robot3/odom
    global_frame: robot3/map
    robot_base_frame: robot3/base_link
    transform_tolerance: 0.30

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    simulate_ahead_time: 2.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.20
    rotational_acc_lim: 2.0

    enable_stamped_cmd_vel: false


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: robot3/map
    robot_base_frame: robot3/base_link
    odom_topic: /robot3/odom

    transform_tolerance: 0.30
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 5000

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    action_server_result_timeout: 900.0

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0